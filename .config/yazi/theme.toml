# base16-black-metal-gorgoroth — matches nvim colorscheme
# palette: bg #000000, fg #c1c1c1, grays #121212/#222222/#333333/#444444/#888888/#999999/#aaaaaa
# accents: red #5f8787, green #9b8d7f, yellow #8c7f70, blue #888888

[mgr]
cwd = { fg = "#aaaaaa", bold = true }
hovered = { fg = "#000000", bg = "#888888" }
preview_hovered = { underline = true }
find_keyword = { fg = "#8c7f70", bold = true, underline = true }
find_position = { fg = "#5f8787", bg = "reset", bold = true }
marker_copied = { fg = "#9b8d7f", bg = "#9b8d7f" }
marker_cut = { fg = "#5f8787", bg = "#5f8787" }
marker_marked = { fg = "#888888", bg = "#888888" }
marker_selected = { fg = "#8c7f70", bg = "#8c7f70" }
count_copied = { fg = "#000000", bg = "#9b8d7f" }
count_cut = { fg = "#000000", bg = "#5f8787" }
count_selected = { fg = "#000000", bg = "#8c7f70" }
border_symbol = "│"
border_style = { fg = "#444444" }

[tabs]
active = { fg = "#000000", bg = "#aaaaaa", bold = true }
inactive = { fg = "#999999", bg = "#222222" }

[mode]
normal_main = { fg = "#000000", bg = "#888888", bold = true }
normal_alt = { fg = "#888888", bg = "#222222" }
select_main = { fg = "#000000", bg = "#8c7f70", bold = true }
select_alt = { fg = "#8c7f70", bg = "#222222" }
unset_main = { fg = "#000000", bg = "#5f8787", bold = true }
unset_alt = { fg = "#5f8787", bg = "#222222" }

[status]
overall = { fg = "#c1c1c1", bg = "#121212" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#888888" }
perm_read = { fg = "#8c7f70" }
perm_write = { fg = "#5f8787" }
perm_exec = { fg = "#9b8d7f" }
perm_sep = { fg = "#444444" }
progress_label = { fg = "#c1c1c1", bold = true }
progress_normal = { fg = "#888888", bg = "#222222" }
progress_error = { fg = "#5f8787", bg = "#222222" }

[which]
mask = { bg = "#121212" }
cand = { fg = "#9b8d7f" }
rest = { fg = "#999999" }
desc = { fg = "#c1c1c1" }
separator = "  "
separator_style = { fg = "#444444" }

[confirm]
border = { fg = "#444444" }
title = { fg = "#c1c1c1", bold = true }
content = { fg = "#c1c1c1" }
list = { fg = "#c1c1c1" }
btn_yes = { fg = "#000000", bg = "#888888" }
btn_no = { fg = "#c1c1c1" }

[spot]
border = { fg = "#444444" }
title = { fg = "#c1c1c1", bold = true }
tbl_col = { fg = "#aaaaaa", bold = true }
tbl_cell = { fg = "#000000", bg = "#888888" }

[notify]
title_info = { fg = "#9b8d7f" }
title_warn = { fg = "#8c7f70" }
title_error = { fg = "#5f8787" }

[pick]
border = { fg = "#444444" }
active = { fg = "#000000", bg = "#888888", bold = true }
inactive = { fg = "#c1c1c1" }

[input]
border = { fg = "#444444" }
title = { fg = "#c1c1c1" }
value = { fg = "#c1c1c1" }
selected = { bg = "#333333" }

[cmp]
border = { fg = "#444444" }
active = { fg = "#000000", bg = "#888888" }
inactive = { fg = "#c1c1c1" }

[tasks]
border = { fg = "#444444" }
title = { fg = "#c1c1c1" }
hovered = { fg = "#000000", bg = "#888888" }

[help]
on = { fg = "#9b8d7f" }
run = { fg = "#888888" }
desc = { fg = "#999999" }
hovered = { fg = "#000000", bg = "#888888" }
footer = { fg = "#c1c1c1" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#8c7f70" },
	{ mime = "{audio,video}/*", fg = "#888888" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-rar,x-xz}", fg = "#5f8787" },
	{ url = "*", is = "orphan", fg = "#5f8787", crossed = true },
	{ url = "*", is = "exec", fg = "#9b8d7f" },
	{ url = "*/", fg = "#aaaaaa", bold = true },
	{ url = "*", fg = "#c1c1c1" },
]
