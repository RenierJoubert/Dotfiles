backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

inactive-opacity = 1.0; 
active-opacity = 1.0;
frame-opacity = 0.9;

corner-radius = 0;

blur-method = "dual_kawase";
blur-strength = 4;

blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'maim'"
];

wintypes:
{
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
